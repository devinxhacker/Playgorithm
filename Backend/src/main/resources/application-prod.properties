spring.application.name=Playgorithm

# Server Configuration - Elastic Beanstalk uses port 5000 by default
server.port=5000

# Disable SSL - Elastic Beanstalk Load Balancer handles HTTPS
server.ssl.enabled=false

# MongoDB Configuration (from environment variables)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:playgorithm}

# JWT Configuration (from environment variables)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Admin Configuration (from environment variables)
admin.signup.secret=${ADMIN_SIGNUP_SECRET}
admin.bootstrap.username=${ADMIN_USERNAME:admin}
admin.bootstrap.email=${ADMIN_EMAIL:admin@playgorithm.com}
admin.bootstrap.password=${ADMIN_PASSWORD}

# CORS Configuration (from environment variables)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging - reduce verbosity in production
logging.level.com.super30.Playgorithm=INFO
logging.level.org.springframework.security=WARN
logging.level.root=WARN

# Gemini / Copilot (from environment variable)
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
